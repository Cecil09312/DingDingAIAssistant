# ===== 钉钉 AI 智能体助手 - 全局提示词集中配置 =====
# 说明：
# 1. 所有 LLM 提示词、语气映射、关键词词典统一存放于本文件
# 2. 占位符使用 Python str.format() 语法：{variable_name}
# 3. 当提示词中需要字面 { 或 } 字符时（如 JSON 示例），写成 {{ 或 }} 转义
# 4. 多行提示词统一使用 YAML 的 | 块字符串，保留换行
# 5. 修改后无需重启代码即可生效（程序下次加载时读取最新内容）

# ===== 智能体主流程 =====
agent:
  # 主系统 prompt 模板
  # 占位符：{memory_section} {rag_section} {memory_instruction}
  system_prompt_template: |
    你是一个钉钉 AI 智能体助手，友好、专业地为用户解答问题、提供建议。

    {memory_section}

    {rag_section}

    请根据用户当前输入和历史对话，给出有帮助、连贯的回答。如果检索到的参考资料与问题相关，请优先依据资料作答，并在末尾注明信息来源；若资料不足，可结合自身知识回答但需说明。{memory_instruction}

  # 存在长期记忆时的显式使用指令（解决"模型不使用已有信息"问题）
  memory_instruction: "若用户询问关于其自身的信息（如姓名、称呼、偏好、项目等），必须优先使用上述“用户画像/已知事实”作答，不得回答不知道。"

  # 关键信息结构化抽取 prompt（每轮一次，失败静默跳过）
  # 占位符：{user_input} {answer}
  extract_prompt: |
    从本轮对话中抽取值得长期记住的用户信息，只抽取用户明确陈述的内容，不要推测。
    输出 JSON（不要输出其他内容）：
    {{"profile": {{"name": null, "role": null, "project": null, "company": null}},
     "facts": [{{"fact": "用一句话描述的事实", "priority": 1}}]}}
    priority 取值 1-10，1 为最重要（如姓名、明确要求记住的信息）。
    若无值得记忆的信息，输出：{{"profile": {{}}, "facts": []}}

    对话：
    用户: {user_input}
    助手: {answer}

  # 路由判断 prompt：决定使用知识库检索、联网搜索还是直接闲聊（RAG 优先）
  # 占位符：{input}
  router_prompt: |
    判断用户输入需要哪种处理方式：

    rag: 询问产品功能、使用方法、公司政策、文档内容、具体知识等可从知识库回答的问题
    web: 询问最新新闻、实时信息、天气、当前事件、网络搜索等需要联网的问题
    chat: 闲聊、问候、情感表达、简单确认等

    路由优先级（重要）：
    1. 优先 rag：凡是可以尝试从知识库回答的知识/方法/政策/流程类问题，一律选 rag
    2. 仅当问题明确需要时效性信息（新闻/天气/实时动态），且知识库不可能包含时，才选 web
    3. 不确定时选 rag，不要选 chat

    只输出一个单词：rag、web 或 chat，不要输出其他内容。

    用户输入：{input}

  # 简化的关键词路由兜底（当 LLM 不可用时，RAG 关键词优先于联网搜索关键词判断）
  router_keywords:
    - "怎么"
    - "如何"
    - "什么"
    - "为什么"
    - "哪里"
    - "是否"
    - "能不能"
    - "可以吗"
    - "介绍"
    - "说明"
    - "功能"
    - "用法"
    - "政策"
    - "规则"
    - "流程"
    - "文档"
    - "价格"
    - "费用"
    - "时间"
    - "区别"
    - "对比"
    - "帮助"

  # 联网搜索关键词（用于关键词兜底判断是否需要联网）
  web_search_keywords:
    - "最新"
    - "今天"
    - "昨天"
    - "现在"
    - "目前"
    - "实时"
    - "新闻"
    - "天气"
    - "热点"
    - "近期"
    - "最近"
    - "当前"
    - "上线"
    - "发布"
    - "热搜"
    - "排行"

  # LLM 生成失败时的兜底文案
  # 占位符：{error}
  error_fallback: "抱歉，我暂时无法处理您的请求。错误信息: {error}"


# ===== 长期记忆 =====
memory:
  # 对话摘要 prompt（首次生成摘要时使用）
  # 占位符：{conversation}
  summary_prompt: |
    请将以下对话历史总结为简洁的要点，保留关键事实、用户偏好和重要上下文，便于后续对话引用。直接输出摘要，不要添加多余说明。

    对话历史：
    {conversation}

  # 增量合并摘要 prompt：携带旧摘要，强制保留关键信息（防止覆盖式丢失）
  # 占位符：{old_summary} {conversation}
  merge_summary_prompt: |
    你是记忆管理器。请将“旧摘要”与“新对话”合并为一份更新后的摘要，并抽取关键事实。
    要求：
    1. 必须保留旧摘要中的用户姓名、称呼、偏好等关键信息，不得删除；
    2. 合并新对话中的重要事实，去除已被更新的过时信息；
    3. 摘要简洁，不超过 300 字；
    4. 只输出 JSON：{{"summary": "...", "key_facts": ["..."]}}，不要输出其他内容。

    旧摘要：
    {old_summary}

    新对话：
    {conversation}
