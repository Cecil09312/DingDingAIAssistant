<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钉钉AI智能体助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: #f3f6fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部栏 */
        header {
            background: #0089ff;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 137, 255, 0.3);
        }

        header h1 { font-size: 17px; font-weight: 600; }

        #resetBtn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #resetBtn:hover { background: rgba(255, 255, 255, 0.35); }

        /* 消息区 */
        #chatArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .msg-row {
            display: flex;
            margin-bottom: 16px;
            gap: 10px;
        }

        .msg-row.user { flex-direction: row-reverse; }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            font-weight: 600;
        }

        .msg-row.user .avatar { background: #0089ff; }
        .msg-row.bot .avatar { background: #34c759; }

        .bubble-wrap {
            max-width: 68%;
            display: flex;
            flex-direction: column;
        }

        .msg-row.user .bubble-wrap { align-items: flex-end; }

        .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-row.user .bubble {
            background: #0089ff;
            color: #fff;
            border-top-right-radius: 4px;
        }

        .msg-row.bot .bubble {
            background: #fff;
            color: #26303a;
            border-top-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(38, 48, 58, 0.08);
        }

        /* 节点状态提示 */
        .status-tip {
            font-size: 12px;
            color: #8a97a5;
            margin-top: 4px;
            padding-left: 2px;
        }

        /* 输入区 */
        footer {
            background: #fff;
            padding: 14px 24px;
            border-top: 1px solid #e6ebf0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #userInput {
            flex: 1;
            border: 1px solid #d9e1e8;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        #userInput:focus { border-color: #0089ff; }

        #sendBtn {
            background: #0089ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 26px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        #sendBtn:hover:not(:disabled) { background: #007ae6; }
        #sendBtn:disabled { background: #a8d4ff; cursor: not-allowed; }

        /* 加载动画（打字中） */
        .typing-dots { display: inline-flex; gap: 4px; align-items: center; }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #b8c4ce;
            border-radius: 50%;
            animation: blink 1.2s infinite both;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <h1>钉钉AI智能体助手</h1>
        <button id="resetBtn">重置会话</button>
    </header>

    <div id="chatArea"></div>

    <footer>
        <textarea id="userInput" placeholder="输入您的问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn">发送</button>
    </footer>

<script>
    const chatArea = document.getElementById("chatArea");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");

    // 会话标识：重置时生成新 session_id（后端按 session_id 维护短期记忆）
    const USER_ID = "web-user";
    let sessionId = newSessionId();
    let sending = false;

    function newSessionId() {
        return "web-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    }

    // 创建消息行，返回气泡元素（content 为 null 时显示打字动画）
    function appendMsg(role, content) {
        const row = document.createElement("div");
        row.className = "msg-row " + role;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "我" : "AI";

        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (content === null) {
            bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
        } else {
            bubble.textContent = content;
        }

        wrap.appendChild(bubble);
        row.appendChild(avatar);
        row.appendChild(wrap);
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;
        return { bubble, wrap };
    }

    // 更新节点状态提示（路由/检索/生成）
    function setStatusTip(wrap, text) {
        let tip = wrap.querySelector(".status-tip");
        if (!tip) {
            tip = document.createElement("div");
            tip.className = "status-tip";
            wrap.appendChild(tip);
        }
        tip.textContent = text;
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text || sending) return;

        sending = true;
        sendBtn.disabled = true;
        userInput.value = "";
        userInput.style.height = "44px";

        appendMsg("user", text);
        const { bubble, wrap } = appendMsg("bot", null);
        let gotToken = false;

        try {
            // SSE 流式请求：fetch + ReadableStream 解析
            const resp = await fetch("/api/chat/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user_input: text,
                    user_id: USER_ID,
                    session_id: sessionId,
                }),
            });

            if (!resp.ok) {
                let errmsg = "请求失败 (" + resp.status + ")";
                try {
                    const err = await resp.json();
                    if (err.errmsg) errmsg = err.errmsg;
                } catch (e) {}
                bubble.textContent = errmsg;
                return;
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                // SSE 按 \n\n 分隔事件
                const parts = buffer.split("\n\n");
                buffer = parts.pop();
                for (const part of parts) {
                    for (const line of part.split("\n")) {
                        if (!line.startsWith("data:")) continue;
                        let ev;
                        try {
                            ev = JSON.parse(line.slice(5).trim());
                        } catch (e) { continue; }

                        if (ev.type === "status") {
                            setStatusTip(wrap, ev.status);
                        } else if (ev.type === "token") {
                            if (!gotToken) {
                                bubble.textContent = "";
                                gotToken = true;
                            }
                            bubble.textContent += ev.content;
                            chatArea.scrollTop = chatArea.scrollHeight;
                        } else if (ev.type === "error") {
                            if (!gotToken) bubble.textContent = "";
                            bubble.textContent += ev.errmsg || "服务异常，请稍后重试";
                        }
                    }
                }
            }

            if (!gotToken) bubble.textContent = "抱歉，我暂时无法回答您的问题。";
        } catch (e) {
            bubble.textContent = "网络异常，请检查服务是否运行：" + e.message;
        } finally {
            // 移除状态提示
            const tip = wrap.querySelector(".status-tip");
            if (tip) tip.remove();
            sending = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener("click", sendMessage);

    // Enter 发送，Shift+Enter 换行
    userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 输入框自适应高度
    userInput.addEventListener("input", () => {
        userInput.style.height = "auto";
        userInput.style.height = Math.min(userUserInputHeight(), 120) + "px";
    });

    function userUserInputHeight() {
        userInput.style.height = "auto";
        return userInput.scrollHeight;
    }

    // 重置会话：生成新 session_id 并清空界面
    resetBtn.addEventListener("click", () => {
        sessionId = newSessionId();
        chatArea.innerHTML = "";
        appendMsg("bot", "会话已重置，请问有什么可以帮您？");
        userInput.focus();
    });

    // 欢迎语
    appendMsg("bot", "您好，我是钉钉AI智能体助手，支持知识库问答、联网搜索、待办与会议管理。请问有什么可以帮您？");
    userInput.focus();
</script>
</body>
</html>
